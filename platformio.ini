; ESP32-S3 learning sessions.
; One PlatformIO project, one environment per lesson: `uv run pio run -e 02-led -t upload`.
; Every lesson shares the board settings in [env]; each one only picks its own source folder.

[platformio]
default_envs = 01-hello

[env]
; pioarduino = the community-maintained platform that ships Arduino-ESP32 3.x (pinned release).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; Exact match for the ESP32-S3-N16R8: 16 MB quad flash + 8 MB octal PSRAM.
board = esp32-s3-devkitc1-n16r8
framework = arduino
build_flags =
    ; 0 none, 1 error, 2 warn, 3 info, 4 debug, 5 verbose. Drives log_e/log_w/log_i/log_d.
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Iinclude
; Leave the port empty and PlatformIO auto-detects it. Set ESP_PORT to force one.
upload_port = ${sysenv.ESP_PORT}
monitor_port = ${sysenv.ESP_PORT}
monitor_speed = 115200
; time: timestamp every line · colorize: colour the log levels · decoder: readable crash traces
monitor_filters = time, colorize, esp32_exception_decoder
; Lets you type commands into the serial monitor (used from lesson 02).
monitor_echo = yes
monitor_eol = LF

[env:01-hello]
; Meet the board: print its identity card and cycle the on-board RGB LED.
build_src_filter = +<01-hello/>

[env:02-led]
; First circuit: an external LED on the breadboard, driven by serial commands.
build_src_filter = +<02-led/>

[env:pin-check]
; Diagnostic: are the screen wires shorted or broken? Short test + an LED probe on each data pin.
build_src_filter = +<pin-check/>

[env:03-display]
; The 1.9" 170x320 ST7789 IPS screen over SPI.
build_src_filter = +<03-display/>
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    ; Pulled in by the ST7789 library and actually used; pinned so every build is the same.
    adafruit/Adafruit BusIO@1.17.4
; The ST7789 library also lists these for other Adafruit boards. We never use them, so never build them.
lib_ignore =
    SD
    Adafruit seesaw Library

[env:03b-showcase]
; Variation 1: a bigger display demo on the same wiring (3D torus, plasma, fireworks, live dashboard).
; Controlled with the on-board BOOT button. Nothing new to wire.
build_src_filter = +<03b-showcase/> -<03b-showcase/controls/with_button.cpp>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:03b-showcase-button]
; Variation 2: the same showcase, driven by a push button on GPIO 5 (plus BOOT).
build_src_filter = +<03b-showcase/> -<03b-showcase/controls/boot_only.cpp>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

; ----- Wi-Fi track ---------------------------------------------------------------------------

; Shared code for every Wi-Fi lab lives in lib/wifi-kit (scanner, connection, ping, screens).
; Every lab: the screen from lesson 03. The push button on GPIO 5 is optional (it does what BOOT does).
; The saved network is shared between labs, so switching keeps it.

[env:wifi-lab-w1]
; W1 Scan & join: scanner views, join your network (password in NVS), status view, ping.
build_src_filter = +<wifi-lab-w1/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:wifi-lab-w2]
; W2 Phone control, variation 1: W1 plus REST API + WebSocket, phone page, set-up network,
; firmware updates over HTTP. Control from your own Wi-Fi.
build_src_filter = +<wifi-lab-w2/> -<wifi-lab-w2/remote/relay.cpp>
lib_deps =
    ${env:03-display.lib_deps}
    ; Async web server + WebSocket (the maintained ESP32Async forks) and JSON.
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
lib_ignore = ${env:03-display.lib_ignore}

[env:wifi-lab-w2-remote]
; W2 Phone control, variation 2: everything above, plus the board dials out to the dashboard
; server (through a cloudflared or ngrok tunnel) so you can control it from anywhere.
build_src_filter = +<wifi-lab-w2/> -<wifi-lab-w2/remote/off.cpp>
lib_deps =
    ${env:wifi-lab-w2.lib_deps}
    ; WebSocket client with TLS (wss://), used only by remote/relay.cpp.
    links2004/WebSockets@2.7.3
lib_ignore = ${env:03-display.lib_ignore}

[env:wifi-lab-w3]
; W3 Internet & AI: weather over HTTPS + JSON (Open-Meteo, no key), and the Bench Oracle: Claude
; (Anthropic API, key stored on the chip) writes a haiku about the moment or answers questions.
build_src_filter = +<wifi-lab-w3/>
lib_deps =
    ${env:03-display.lib_deps}
    bblanchon/ArduinoJson@7.4.3
lib_ignore = ${env:03-display.lib_ignore}

; ----- RFID track ---------------------------------------------------------------------------

; Every RFID lab: the screen from lesson 03 + the RC522 (see include/pins.h); push button optional.
; Shared code: lib/rfid-kit (our MFRC522 driver) and lib/rfid-lab-kit (reader task, views, edge
; experiments, the lab shell). Each lab's main.cpp lists its own views and serial commands.

[env:rfid-lab-r1]
; R1 Wire & talk: the chip itself. chip, reset, selftest, loopback, regs, spi, gain, timeout, irq.
build_src_filter = +<rfid-lab-r1/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r2]
; R2 Wake a card: + the trace view, poll, trace.
build_src_filter = +<rfid-lab-r2/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r3]
; R3 Who's there: + inventory (two cards at once).
build_src_filter = +<rfid-lab-r3/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r4]
; R4 Inside the card: + the memory view, dump, read.
build_src_filter = +<rfid-lab-r4/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r5]
; R5 Write & count: + the credits view, write, credits.
build_src_filter = +<rfid-lab-r5/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r6]
; R6 Edge lab: + the edge view and the seven edge experiments.
build_src_filter = +<rfid-lab-r6/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r7]
; R7 Card manager: a bench door (simulated: screen + LED) managed from the React app in
; test-esp/door-app over Wi-Fi. The board keeps the card list in NVS and decides every tap.
; JSON API + WebSocket on port 80 (the same web libraries as W2); admin token for every change.
build_src_filter = +<rfid-lab-r7/>
lib_deps =
    ${env:03-display.lib_deps}
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
lib_ignore = ${env:03-display.lib_ignore}

[env:rfid-lab-r8]
; R8 Card friends: a kids' lab. Every card is the home of a friend (fox, robot, dragon, ...): tap
; it and the friend pops out on the screen and in 3D in test-esp/friends-app, where you drag
; friends onto cards. New cards add themselves on their first tap. UID only, nothing is written.
; R7's driver, reader health checks, web libraries and admin token.
build_src_filter = +<rfid-lab-r8/>
lib_deps = ${env:rfid-lab-r7.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

; ----- Bluetooth LE track ---------------------------------------------------------------------

; Every BLE lab: the screen from lesson 03; the push button on GPIO 5 is optional. The ESP32-S3
; has Bluetooth LE 5 only (no Classic Bluetooth: no audio streaming to speakers, no SPP).
; Shared code: lib/ble-kit (the lab shell with its status bar, link state, activity log, the
; advertising decoder, the Bench GATT service). Each lab's main.cpp lists its own views and commands.
; NimBLE-Arduino = the lightweight NimBLE host stack (half the flash and RAM of Bluedroid).

[ble]
lib_deps =
    ${env:03-display.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1

[env:ble-lab-b1]
; B1 Listen: a scanner. Radar, list, a byte-by-byte packet inspector, air statistics.
build_src_filter = +<ble-lab-b1/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b3]
; B3 Connect & talk: a GATT server. LED, message, button, temperature from nRF Connect/LightBlue.
build_src_filter = +<ble-lab-b3/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b2]
; B2 Be seen: a beacon. Live data in the advertisement, iBeacon and Eddystone-URL, TX power, interval.
build_src_filter = +<ble-lab-b2/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b4]
; B4 Pair & trust: B3's service plus a Vault. Passkey on the screen, numeric comparison on the button, bonds.
build_src_filter = +<ble-lab-b4/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b5]
; B5 Phone app: B3's service plus sketch, live sensors and a speed test for the Web Bluetooth app in test-esp/ble-app.
build_src_filter = +<ble-lab-b5/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b6]
; B6 Keyboard & media: a BLE keyboard with media keys. Volume and play/pause for the music on your phone or Mac.
build_src_filter = +<ble-lab-b6/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b7]
; B7 Music: a BLE-MIDI instrument for GarageBand or the ble-app synth. Button and touch wires play notes.
build_src_filter = +<ble-lab-b7/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:ble-lab-b8]
; B8 Host: the board is the central. Explore any device's GATT, then host your BLE keyboard and mouse.
build_src_filter = +<ble-lab-b8/>
lib_deps = ${ble.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

; ----- Sound track ----------------------------------------------------------------------------

; Every sound lab: the screen from lesson 03 + the KY-037 microphone module (AO -> GPIO 6,
; DO -> GPIO 21, + -> 3V3, G -> GND; see include/pins.h); the push button on GPIO 5 is optional.
; Shared code: lib/sound-kit (the sampler task on the ADC's DMA, level meter, clap/knock/beat
; detectors, FFT, the lab shell). Each lab's main.cpp lists its own views and commands.

[env:sound-lab-s1]
; S1 Hear: the raw signal. Oscilloscope, the DC bias and the ADC's range, the comparator (DO + pot).
build_src_filter = +<sound-lab-s1/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:sound-lab-s2]
; S2 Loudness: a sound level meter. dB above your room's quiet, fast/slow, a 10-minute diary, alarm.
build_src_filter = +<sound-lab-s2/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:sound-lab-s3]
; S3 Clap control: claps (not voices) in patterns of 1-4 switch the LED, the RGB LED and the screen.
build_src_filter = +<sound-lab-s3/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:sound-lab-s4]
; S4 Recorder: a voice-activated recorder into PSRAM, with half a second of "before". Listen and
; download on your phone at http://bench.local (Wi-Fi saved by W1, admin token), or pull a WAV
; over USB with tools/sound_pull.py.
build_src_filter = +<sound-lab-s4/>
lib_deps =
    ${env:03-display.lib_deps}
    esp32async/ESPAsyncWebServer@3.12.1
    esp32async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
lib_ignore = ${env:03-display.lib_ignore}

[env:sound-lab-s5]
; S5 Spectrum: our own FFT. Bands, a waterfall, a whistle tuner, and steering by pitch.
build_src_filter = +<sound-lab-s5/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}

[env:sound-lab-s6]
; S6 Sound games: a knock lock (your secret rhythm), Clap Bird, and a beat-following light party.
build_src_filter = +<sound-lab-s6/>
lib_deps = ${env:03-display.lib_deps}
lib_ignore = ${env:03-display.lib_ignore}
