; R6 Edge lab. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r6
extra_configs = ../../common.ini

[env:rfid-lab-r6]
; R6 Edge lab: + the edge view and the seven edge experiments.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
