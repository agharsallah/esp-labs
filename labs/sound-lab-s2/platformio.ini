; S2 Loudness. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s2
extra_configs = ../../common.ini

[env:sound-lab-s2]
; S2 Loudness: a sound level meter. dB above your room's quiet, fast/slow, a 10-minute diary, alarm.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
