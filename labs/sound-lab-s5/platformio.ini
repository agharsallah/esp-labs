; S5 Spectrum. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s5
extra_configs = ../../common.ini

[env:sound-lab-s5]
; S5 Spectrum: our own FFT. Bands, a waterfall, a whistle tuner, and steering by pitch.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
