; W1 Scan & join. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = wifi-lab-w1
extra_configs = ../../common.ini

[env:wifi-lab-w1]
; W1 Scan & join: scanner views, join your network (password in NVS), status view, ping.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
