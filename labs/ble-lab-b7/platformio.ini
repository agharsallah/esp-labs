; B7 Music. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b7
extra_configs = ../../common.ini

[env:ble-lab-b7]
; B7 Music: a BLE-MIDI instrument for GarageBand or the ble-app synth. Button and touch wires play notes.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
