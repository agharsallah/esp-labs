; The 1. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = 03-display
extra_configs = ../../common.ini

[env:03-display]
; The 1.9" 170x320 ST7789 IPS screen over SPI.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
