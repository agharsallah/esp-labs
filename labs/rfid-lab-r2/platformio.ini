; R2 Wake a card. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r2
extra_configs = ../../common.ini

[env:rfid-lab-r2]
; R2 Wake a card: + the trace view, poll, trace.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
