; B4 Pair & trust. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b4
extra_configs = ../../common.ini

[env:ble-lab-b4]
; B4 Pair & trust: B3's service plus a Vault. Passkey on the screen, numeric comparison on the button, bonds.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
