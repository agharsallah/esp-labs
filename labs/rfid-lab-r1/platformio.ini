; R1 Wire & talk. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r1
extra_configs = ../../common.ini

[env:rfid-lab-r1]
; R1 Wire & talk: the chip itself. chip, reset, selftest, loopback, regs, spi, gain, timeout, irq.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
