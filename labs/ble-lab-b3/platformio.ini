; B3 Connect & talk. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b3
extra_configs = ../../common.ini

[env:ble-lab-b3]
; B3 Connect & talk: a GATT server. LED, message, button, temperature from nRF Connect/LightBlue.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
