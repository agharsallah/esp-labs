; R7 Card manager. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r7
extra_configs = ../../common.ini

[env:rfid-lab-r7]
; R7 Card manager: a bench door (simulated: screen + LED) managed from the React app in
; esp-labs/apps/door-app over Wi-Fi. The board keeps the card list in NVS and decides every tap.
; JSON API + WebSocket on port 80 (the same web libraries as W2); admin token for every change.
lib_deps = ${web.lib_deps}
lib_ignore = ${display.lib_ignore}
