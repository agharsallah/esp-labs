; S4 Recorder. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s4
extra_configs = ../../common.ini

[env:sound-lab-s4]
; S4 Recorder: a voice-activated recorder into PSRAM, with half a second of "before". Listen and
; download on your phone at http://bench.local (Wi-Fi saved by W1, admin token), or pull a WAV
; over USB with tools/sound_pull.py.
lib_deps = ${web.lib_deps}
lib_ignore = ${display.lib_ignore}
