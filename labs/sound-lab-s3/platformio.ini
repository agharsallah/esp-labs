; S3 Clap control. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s3
extra_configs = ../../common.ini

[env:sound-lab-s3]
; S3 Clap control: claps (not voices) in patterns of 1-4 switch the LED, the RGB LED and the screen.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
