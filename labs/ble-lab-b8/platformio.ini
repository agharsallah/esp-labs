; B8 Host. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b8
extra_configs = ../../common.ini

[env:ble-lab-b8]
; B8 Host: the board is the central. Explore any device's GATT, then host your BLE keyboard and mouse.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
