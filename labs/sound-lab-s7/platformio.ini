; S7 Speaker. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s7
extra_configs = ../../common.ini

[env:sound-lab-s7]
; S7 Speaker: the board makes sound. Waveforms, envelopes, notes and tunes, a keyboard, a sound-effects box.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
