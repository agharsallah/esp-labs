; S8 Voice FX. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s8
extra_configs = ../../common.ini

[env:sound-lab-s8]
; S8 Voice FX: microphone in, speaker out. A parrot that repeats you as a chipmunk, a giant or a
; robot, an echo, and a talking-robot mode. Needs the INMP441 + the speaker for good results.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
