; S6 Sound games. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s6
extra_configs = ../../common.ini

[env:sound-lab-s6]
; S6 Sound games: a knock lock (your secret rhythm), Clap Bird, and a beat-following light party.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
