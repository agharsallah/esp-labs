; R4 Inside the card. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r4
extra_configs = ../../common.ini

[env:rfid-lab-r4]
; R4 Inside the card: + the memory view, dump, read.
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
