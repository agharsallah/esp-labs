; S1 Hear. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = sound-lab-s1
extra_configs = ../../common.ini

[env:sound-lab-s1]
; S1 Hear: the raw signal. Oscilloscope, the DC bias and the ADC's range, the comparator (DO + pot).
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
