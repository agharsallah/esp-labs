; B2 Be seen. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b2
extra_configs = ../../common.ini

[env:ble-lab-b2]
; B2 Be seen: a beacon. Live data in the advertisement, iBeacon and Eddystone-URL, TX power, interval.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
