; B1 Listen. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b1
extra_configs = ../../common.ini

[env:ble-lab-b1]
; B1 Listen: a scanner. Radar, list, a byte-by-byte packet inspector, air statistics.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
