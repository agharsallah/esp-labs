; W3 Internet & AI. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = wifi-lab-w3
extra_configs = ../../common.ini

[env:wifi-lab-w3]
; W3 Internet & AI: weather over HTTPS + JSON (Open-Meteo, no key), and the Bench Oracle: Claude
; (Anthropic API, key stored on the chip) writes a haiku about the moment or answers questions.
lib_deps = ${json.lib_deps}
lib_ignore = ${display.lib_ignore}
