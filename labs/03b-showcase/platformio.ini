; Variation 1. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = 03b-showcase
extra_configs = ../../common.ini

[env:03b-showcase]
; Variation 1: a bigger display demo on the same wiring (3D torus, plasma, fireworks, live dashboard).
; Controlled with the on-board BOOT button. Nothing new to wire.
build_src_filter = +<*> -<controls/with_button.cpp>
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}

[env:03b-showcase-button]
; Variation 2: the same showcase, driven by a push button on GPIO 5 (plus BOOT).
build_src_filter = +<*> -<controls/boot_only.cpp>
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
