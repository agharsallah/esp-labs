; R3 Who's there. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r3
extra_configs = ../../common.ini

[env:rfid-lab-r3]
; R3 Who's there: + inventory (two cards at once).
lib_deps = ${display.lib_deps}
lib_ignore = ${display.lib_ignore}
