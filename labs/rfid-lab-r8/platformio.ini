; R8 Card friends. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = rfid-lab-r8
extra_configs = ../../common.ini

[env:rfid-lab-r8]
; R8 Card friends: a kids' lab. Every card is the home of a friend (fox, robot, dragon, ...): tap
; it and the friend pops out on the screen and in 3D in esp-labs/apps/friends-app, where you drag
; friends onto cards. New cards add themselves on their first tap. UID only, nothing is written.
; R7's driver, reader health checks, web libraries and admin token.
lib_deps = ${web.lib_deps}
lib_ignore = ${display.lib_ignore}
