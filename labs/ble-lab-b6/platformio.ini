; B6 Keyboard & media. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b6
extra_configs = ../../common.ini

[env:ble-lab-b6]
; B6 Keyboard & media: a BLE keyboard with media keys. Volume and play/pause for the music on your phone or Mac.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
