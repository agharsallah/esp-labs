; B5 Phone app. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = ble-lab-b5
extra_configs = ../../common.ini

[env:ble-lab-b5]
; B5 Phone app: B3's service plus sketch, live sensors and a speed test for the Web Bluetooth app in esp-labs/apps/ble-app.
lib_deps = ${ble.lib_deps}
lib_ignore = ${display.lib_ignore}
build_flags = ${ble.build_flags}
