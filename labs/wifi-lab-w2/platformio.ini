; W2 Phone control, variation 1. A standalone PlatformIO project in the esp-labs monorepo.
; Board settings, the kit (../../kit) and library sets live in ../../common.ini.

[platformio]
default_envs = wifi-lab-w2
extra_configs = ../../common.ini

[env:wifi-lab-w2]
; W2 Phone control, variation 1: W1 plus REST API + WebSocket, phone page, set-up network,
; firmware updates over HTTP. Control from your own Wi-Fi.
build_src_filter = +<*> -<remote/relay.cpp>
lib_deps = ${web.lib_deps}
lib_ignore = ${display.lib_ignore}

[env:wifi-lab-w2-remote]
; W2 Phone control, variation 2: everything above, plus the board dials out to the dashboard
; server (through a cloudflared or ngrok tunnel) so you can control it from anywhere.
build_src_filter = +<*> -<remote/off.cpp>
lib_deps = ${relay.lib_deps}
lib_ignore = ${display.lib_ignore}
