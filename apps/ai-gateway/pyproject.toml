[project]
name = "bench-ai-gateway"
version = "0.1.0"
description = "LiteLLM proxy for the ESP32 bench: one OpenAI-style API for the board, any provider and model behind it."
requires-python = ">=3.12,<3.14"
# Pinned to a release at least two weeks old (LiteLLM had malicious PyPI releases in 2026);
# uv.lock records the hashes of every file.
dependencies = ["litellm[proxy]==1.101.2"]

[tool.uv]
package = false
